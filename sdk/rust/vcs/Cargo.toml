[package]
name = "schemify-vcs"
description = "What every version-control plugin for Schemify shares: the backend rows (git, Mercurial, Jujutsu, Subversion, Perforce) with their CLI parsers, the Source control pane, the annotate file, and the event driver."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
schemify-abi = { path = "../../../crates/protocol/abi", features = ["guest"] }
schemify-format = { path = "../../../crates/protocol/format" }
